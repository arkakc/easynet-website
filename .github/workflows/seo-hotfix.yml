name: SEO Hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply on-page SEO fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          index = Path("public/index.html")
          text = index.read_text(encoding="utf-8")

          replacements = [
              (
                  '        <p class="lead">Easynet IT Solutions Limited is a Port Moresby-based IT consulting, software, ICT infrastructure and managed services company. We keep the website one-page, but structure each service section clearly so customers and search engines can understand exactly what we provide.</p>',
                  '        <p class="lead">Easynet IT Solutions Limited is a Port Moresby-based IT consulting, software, ICT infrastructure and managed services company helping PNG businesses improve operations, security, connectivity and growth through practical technology solutions.</p>'
              ),
              (
                  '        <span class="eyebrow" style="justify-content:center">One-Page Service Catalogue</span>',
                  '        <span class="eyebrow" style="justify-content:center">Our Services</span>'
              ),
              (
                  '        <p>All services remain on this single homepage. Each block is built as a clear searchable section with natural keywords, business outcomes and local PNG relevance.</p>',
                  '        <p>From website development and ERP to networking, CCTV, cybersecurity, Starlink and managed IT support, Easynet provides end-to-end technology solutions for businesses across Papua New Guinea.</p>'
              ),
              (
                  '      "address": {\n        "@type": "PostalAddress",\n        "streetAddress": "Lot 110, Gran Eden, 8 Mile National Capital District PG, Section 147, Port Moresby 121",\n      \n      },',
                  '      "address": {\n        "@type": "PostalAddress",\n        "streetAddress": "Lot 110, Section 147, Gran Eden, 8 Mile",\n        "addressLocality": "Port Moresby",\n        "addressRegion": "National Capital District",\n        "postalCode": "121",\n        "addressCountry": "PG"\n      },'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected homepage text not found: {old[:90]}")
              text = text.replace(old, new, 1)

          index.write_text(text, encoding="utf-8")

          contact = Path("public/contact.html")
          contact_text = contact.read_text(encoding="utf-8")
          old_h1 = "  <h1>Let's Build Something Great</h1>"
          new_h1 = "  <h1>Contact Easynet IT Solutions in Port Moresby</h1>"
          if old_h1 not in contact_text:
              raise SystemExit("Expected contact-page H1 not found")
          contact.write_text(contact_text.replace(old_h1, new_h1, 1), encoding="utf-8")

          # Validate every JSON-LD block after the structured-data repair.
          for filename in (index, contact):
              html = filename.read_text(encoding="utf-8")
              blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', html, flags=re.S)
              if not blocks:
                  raise SystemExit(f"No JSON-LD found in {filename}")
              for block in blocks:
                  json.loads(block)

          # Guard the canonical URL and requested redirect configs.
          homepage = index.read_text(encoding="utf-8")
          assert '<link rel="canonical" href="https://www.easynetpng.com/">' in homepage
          assert '"source": "/index.html"' in Path("vercel.json").read_text(encoding="utf-8")
          assert 'RewriteRule ^index\\.html$ / [R=301,L]' in Path(".htaccess").read_text(encoding="utf-8")

      - name: Check diff
        run: git diff --check

      - name: Commit SEO fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/contact.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize on-page SEO cleanup"
          git push
