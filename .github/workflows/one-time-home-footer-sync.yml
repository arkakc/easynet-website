name: One-time homepage footer sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-home-footer-sync.yml'

permissions:
  contents: write

jobs:
  sync-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Contact footer to homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home_path = Path('public/index.html')
          contact_path = Path('public/contact.html')

          home = home_path.read_text(encoding='utf-8')
          contact = contact_path.read_text(encoding='utf-8')

          footer_re = re.compile(r'<footer class="site-footer">.*?</footer>', re.S)
          contact_match = footer_re.search(contact)
          if not contact_match:
              raise SystemExit('Contact footer not found')
          if not footer_re.search(home):
              raise SystemExit('Homepage footer not found')

          synced = footer_re.sub(contact_match.group(0), home, count=1)
          home_path.write_text(synced, encoding='utf-8')
          PY

      - name: Commit footer fix and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-home-footer-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/one-time-home-footer-sync.yml
          git commit -m "Restore homepage footer to match Contact page"
          git push
